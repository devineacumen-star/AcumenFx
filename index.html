<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcumenFx</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      height: 60px;
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding: 0 10px 0 20px;
      font-size: 13px;
    }

    .apps {
      width: 40px;
      height: 40px;
      display: grid;
      place-content: center;
      grid-template-columns: repeat(3, 4px);
      grid-template-rows: repeat(3, 4px);
      gap: 3px;
      border-radius: 50%;
    }
    .apps:hover { background: #f0f1f1; }
    .apps i { width: 4px; height: 4px; border-radius: 50%; background: #5f6368; }

    .signin {
      height: 40px;
      min-width: 84px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      padding: 0 16px;
      color: #fff;
      background: #0b57d0;
      font-size: 14px;
      letter-spacing: .1px;
    }
    .signin:hover { background: #1b66d8; text-decoration: none; box-shadow: 0 1px 2px #0003; }

    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 32px;
    }

    .brand {
      height: 118px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 86px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
      user-select: none;
    }
    .blue { color: #4285f4; }
    .red { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green { color: #34a853; }

    .search-form { width: min(100%, 688px); }

    .searchbox {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      padding: 0 8px 0 14px;
      box-shadow: 0 1px 6px #20212424;
      transition: box-shadow .15s ease;
    }
    .searchbox:hover, .searchbox:focus-within {
      border-color: transparent;
      box-shadow: 0 1px 6px #20212440;
    }

    .icon-button {
      width: 32px;
      height: 36px;
      flex: 0 0 32px;
      display: inline-grid;
      place-items: center;
      border: 0;
      padding: 0;
      color: #202124;
      background: transparent;
      cursor: pointer;
    }
    .icon-button svg { width: 20px; height: 20px; }

    .query {
      height: 100%;
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 0;
      color: #202124;
      background: transparent;
      font: 16px Arial, Helvetica, sans-serif;
    }

    .search-tools { display: flex; align-items: center; gap: 8px; }
    .ai-mode {
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 18px;
      padding: 0 11px;
      color: #202124;
      background: #f8f9fa;
      font-size: 14px;
      white-space: nowrap;
    }
    .ai-mode:hover { background: #f1f3f4; text-decoration: none; }
    .ai-mode svg { width: 18px; height: 18px; }

    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 29px; }
    .action-button {
      min-height: 36px;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      padding: 0 16px;
      color: #3c4043;
      background: #f8f9fa;
      font: 14px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .action-button:hover { border-color: #dadce0; box-shadow: 0 1px 1px #0001; }

    .languages {
      margin-top: 47px;
      color: #4d5156;
      font-size: 13px;
      text-align: center;
    }
    .languages a { margin-left: 4px; color: #1a0dab; white-space: nowrap; }

    footer { flex: 0 0 auto; color: #1f1f1f; background: #f2f2f2; font-size: 14px; }
    .country { min-height: 48px; display: flex; align-items: center; padding: 0 30px; border-bottom: 1px solid #dadce0; }
    .footer-row {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 30px;
    }
    .footer-links { display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .footer-row .center-link { margin: 0 auto; text-align: center; }
    .footer-row .right-links { justify-content: flex-end; }

    @media (max-width: 760px) {
      .topbar { gap: 14px; }
      main { padding-right: 18px; padding-left: 18px; }
      .brand { height: 108px; font-size: 76px; }
      .searchbox { gap: 6px; padding-left: 12px; }
      .search-tools { gap: 2px; }
      .ai-mode { padding: 0 8px; }
      .footer-row { flex-wrap: wrap; justify-content: center; gap: 0; padding: 10px 18px; }
      .footer-links { flex-wrap: wrap; justify-content: center; gap: 16px 24px; }
      .footer-row .center-link { order: -1; flex-basis: 100%; margin: 0 0 14px; }
      .footer-row .right-links { justify-content: center; }
    }

    @media (max-width: 430px) {
      .topbar { height: 56px; flex-basis: 56px; gap: 12px; }
      .brand { height: 98px; font-size: 50px; letter-spacing: 0; }
      .searchbox { gap: 2px; padding-right: 6px; }
      .icon-button { width: 28px; flex-basis: 28px; }
      .search-tools { gap: 0; }
      .ai-mode { height: 34px; gap: 3px; padding: 0 7px; font-size: 12px; }
      .ai-mode svg { width: 16px; height: 16px; }
      .actions { gap: 8px; }
      .action-button { padding: 0 12px; font-size: 13px; }
      .languages { max-width: 330px; margin-top: 38px; line-height: 2; }
      .country { min-height: 46px; padding: 0 22px; }
      .footer-row { padding: 12px 18px; }
      .footer-links { gap: 14px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://images.google.com/">Images</a>
    <a class="apps" href="https://www.google.com/intl/en/about/products" aria-label="AcumenFx apps" title="AcumenFx apps">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </a>
    <a class="signin" href="https://accounts.google.com/">Sign in</a>
  </header>

  <main>
    <div class="brand" role="img" aria-label="AcumenFx">
      <span class="red">A</span><span class="yellow">c</span><span class="blue">u</span><span class="green">m</span><span class="red">e</span><span class="blue">n</span><span class="green">F</span><span class="yellow">x</span>
    </div>

    <form class="search-form" action="https://www.google.com/search" method="get" target="_self" role="search">
      <div class="searchbox">
        <button class="icon-button" type="button" aria-label="Add files and tools" title="Add files and tools">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <input class="query" type="search" name="q" aria-label="Search" autocomplete="off" required>
        <div class="search-tools">
          <button class="icon-button" type="button" aria-label="Search by voice" title="Search by voice">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Search by image" title="Search by image">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4H5a2 2 0 0 0-2 2v2m14-4h2a2 2 0 0 1 2 2v2M3 16v2a2 2 0 0 0 2 2h2m14-4v2a2 2 0 0 1-2 2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="11" r="4" stroke="currentColor" stroke-width="2"/><path d="m15 14 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <a class="ai-mode" href="https://www.google.com/">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 13.8 9.2 20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 16v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            AI Mode
          </a>
        </div>
      </div>
      <div class="actions">
        <button class="action-button" type="submit">Find Something Cool</button>
        <button class="action-button" type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
      </div>
    </form>

    <div class="languages">
      AcumenFx offered in:
      <a href="#">Hausa</a><a href="#">Igbo</a><a href="#">E&#768;de&#768; Yor&#249;b&#225;</a><a href="#">Nigerian Pidgin</a>
    </div>
  </main>

  <footer>
    <div class="country">AcumenFx</div>
    <div class="footer-row">
      <nav class="footer-links" aria-label="About AcumenFx">
        <a href="https://about.google/">About</a>
        <a href="https://www.google.com/intl/en_ng/ads/">Advertising</a>
        <a href="https://www.google.com/services/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
      </nav>
      <a class="center-link" href="https://ai.google/">Build, create, and do more with AI tools from AcumenFx</a>
      <nav class="footer-links right-links" aria-label="Legal and settings">
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <a href="https://www.google.com/preferences">Settings</a>
      </nav>
    </div>
  </footer>
</body>
</html>
